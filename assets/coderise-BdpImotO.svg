<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="50%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#0f172a" rx="12"/>
  <rect x="0" y="20" width="800" height="28" fill="#0f172a"/>

  <!-- Logo & Nav -->
  <rect x="16" y="10" width="32" height="28" rx="6" fill="url(#indigo)"/>
  <text x="24" y="30" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="white">C</text>
  <text x="56" y="30" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="white">CodeRise</text>

  <text x="200" y="30" font-family="Arial, sans-serif" font-size="12" fill="#6366f1">Sheets</text>
  <rect x="192" y="42" width="42" height="2" fill="#6366f1"/>
  <text x="260" y="30" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Contests</text>
  <text x="340" y="30" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Interview Prep</text>
  <text x="440" y="30" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Leaderboard</text>

  <rect x="700" y="12" width="84" height="24" rx="12" fill="rgba(79,70,229,0.15)" stroke="#4f46e5" stroke-width="1"/>
  <text x="712" y="28" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#a5b4fc">⚡ 1,240 XP</text>

  <!-- Mission briefing header -->
  <text x="24" y="76" font-family="Arial, sans-serif" font-weight="600" font-size="10" letter-spacing="2" fill="#64748b">MISSION BRIEFING</text>

  <rect x="24" y="86" width="86" height="22" rx="11" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  <text x="36" y="101" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#22c55e">Low Threat</text>
  <rect x="118" y="86" width="52" height="22" rx="11" fill="rgba(34,197,94,0.12)"/>
  <text x="128" y="101" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#4ade80">Easy</text>
  <rect x="178" y="86" width="64" height="22" rx="11" fill="rgba(79,70,229,0.18)"/>
  <text x="188" y="101" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#a5b4fc">+10 XP</text>

  <text x="24" y="136" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="white">Two Sum</text>
  <text x="24" y="158" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Asked at: Google, Amazon, Adobe</text>

  <!-- Code editor panel ("Try it live") -->
  <rect x="24" y="176" width="470" height="230" rx="10" fill="#111827" filter="url(#shadow)"/>
  <rect x="24" y="176" width="470" height="34" fill="#0c1322" rx="10"/>
  <rect x="24" y="192" width="470" height="18" fill="#0c1322"/>
  <text x="40" y="198" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">▸ Try it live</text>
  <rect x="418" y="184" width="60" height="18" rx="9" fill="rgba(79,70,229,0.2)"/>
  <text x="428" y="197" font-family="Arial, sans-serif" font-size="10" fill="#a5b4fc">Python</text>

  <text x="40" y="230" font-family="Consolas, monospace" font-size="11" fill="#64748b">1  def two_sum(nums, target):</text>
  <text x="40" y="248" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">2      seen = {}</text>
  <text x="40" y="266" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">3      for i, n in enumerate(nums):</text>
  <text x="40" y="284" font-family="Consolas, monospace" font-size="11" fill="#a5b4fc">4          if target - n in seen:</text>
  <text x="40" y="302" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">5              return [seen[target-n], i]</text>
  <text x="40" y="320" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">6          seen[n] = i</text>

  <rect x="40" y="336" width="52" height="24" rx="6" fill="url(#emerald)"/>
  <text x="52" y="352" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#022c22">▶ Run</text>

  <rect x="40" y="368" width="438" height="30" rx="6" fill="#0c1322" stroke="#1e293b" stroke-width="1"/>
  <text x="52" y="387" font-family="Consolas, monospace" font-size="11" fill="#4ade80">[0, 1]</text>

  <!-- Sidebar: progress + contest -->
  <rect x="510" y="176" width="266" height="104" rx="10" fill="#111827" filter="url(#shadow)"/>
  <text x="526" y="200" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="white">Sheet progress</text>
  <text x="526" y="218" font-family="Arial, sans-serif" font-size="11" fill="#64748b">142 / 284 solved</text>
  <rect x="526" y="232" width="234" height="8" rx="4" fill="#1e293b"/>
  <rect x="526" y="232" width="120" height="8" rx="4" fill="url(#indigo)"/>
  <text x="526" y="262" font-family="Arial, sans-serif" font-size="11" fill="#f59e0b">🔥 12-day streak</text>

  <rect x="510" y="292" width="266" height="114" rx="10" fill="#111827" filter="url(#shadow)"/>
  <text x="526" y="316" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="white">🏆 Weekly Sprint #1</text>
  <text x="526" y="334" font-family="Arial, sans-serif" font-size="11" fill="#22c55e">Ends in 01:17:24</text>
  <rect x="526" y="346" width="234" height="1" fill="#1e293b"/>
  <text x="526" y="366" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">1. Demo Learner</text>
  <text x="726" y="366" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#a5b4fc">450 pts</text>
  <text x="526" y="384" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">2. Guest_92</text>
  <text x="726" y="384" font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#a5b4fc">300 pts</text>

  <!-- Discussion strip -->
  <rect x="24" y="420" width="752" height="56" rx="10" fill="#111827" filter="url(#shadow)"/>
  <text x="40" y="444" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="white">💬 Discussion (2)</text>
  <text x="40" y="463" font-family="Arial, sans-serif" font-size="11" fill="#64748b">"Anyone have a cleaner one-pass approach?" - Demo Learner</text>
</svg>
